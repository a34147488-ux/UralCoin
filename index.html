<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>UralCoin</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>



<body>


<div class="app">


<div class="city-bg"></div>


<div class="snow">
❄️ ❄️ ❄️ ❄️ ❄️
</div>





<header class="header">


<div class="avatar">


<img id="userAvatar">


<span id="avatarLetter">
U
</span>


</div>


</header>







<main class="content">





<section class="page active" id="game">



<div class="balance-box">


<div class="balance">


<div class="coin-balance">

U

</div>


<span id="balance">

0

</span>



</div>






<div class="click-power">


+ <span id="clickPower">

0.010

</span>

за клик


</div>




<div class="second-power">


В секунду:

<b id="secondPower">

0

</b>


</div>



</div>







<div class="fire-zone">


<button id="clickButton" class="main-coin">

U

</button>


</div>





</section>









<section class="page" id="code">


<div class="panel">


<h2>
Персональный код
</h2>



<input id="myPromo" readonly>



<button class="gold-button" id="copyCode">

Скопировать код

</button>




<hr>




<h2>

Активировать код

</h2>




<input id="promoInput" placeholder="Введите код">



<button class="gold-button" id="activatePromo">

Активировать

</button>




</div>


</section>









<section class="page" id="transfer">


<div class="panel">


<h2>

Перевод

</h2>



<input id="transferName" placeholder="@username">



<input id="transferSum" type="number" placeholder="Количество U">



<div id="transferResults"></div>



<button class="gold-button" id="transferButton">

Перевести

</button>



</div>


</section>









<section class="page" id="tops">


<div class="panel">


<h2>

Топ игроков

</h2>



<div id="topList">

Загрузка...

</div>



</div>


</section>









<section class="page" id="more">



<div class="panel more-scroll">



<h2>

Ещё

</h2>






<a class="gold-button"

href="https://t.me/+NyqTkXAU-H5hNDky"

target="_blank">

Канал проекта

</a>







<button class="menu-card" id="historyBtn">

История операций

</button>







<button class="menu-card" id="apiBtn">

API ключ

</button>






<div id="apiBlock" style="display:none;">



<input id="apiResult" readonly placeholder="Ключ не создан">



<button class="gold-button" id="createApi">

Создать API ключ

</button>



</div>







<h2>

Улучшения

</h2>




<div id="upgradeList">

</div>





</div>



</section>







</main>










<nav class="bottom-nav">


<button class="nav active" data-page="game">

Главная

</button>




<button class="nav" data-page="code">

Код

</button>





<button class="nav" data-page="transfer">

Перевод

</button>





<button class="nav" data-page="tops">

Топ

</button>





<button class="nav" data-page="more">

Ещё

</button>



</nav>





</div>








<script src="config.js"></script>

<script src="storage.js"></script>

<script src="upgrade.js"></script>

<script src="promo.js"></script>

<script src="transfer.js"></script>

<script src="app.js"></script>

<script src="top.js"></script>

<script src="effects.js"></script>

<script src="more.js"></script>



</body>

</html>
