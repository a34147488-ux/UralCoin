<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">


<title>URALcoin</title>


<link rel="stylesheet" href="style.css">


<script src="https://telegram.org/js/telegram-web-app.js"></script>


</head>


<body>


<div class="app">


<div class="city-bg"></div>


<!-- ГИРЛЯНДА -->

<div class="garland">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>




<!-- СНЕГ -->

<div class="snow"></div>







<header class="header">


<div class="user-profile">


<div class="avatar">


<img id="userAvatar">


<span id="avatarLetter">

U

</span>


</div>


</div>


</header>








<main class="content">





<!-- ИГРА -->


<section class="page active" id="game">





<div class="balance-box">



<div class="balance">


<div class="coin-balance">

U

</div>



<span id="balance">

0,000

</span>



</div>







<div class="crystals-box">


<div class="crystal-count">


💎

<span>

0

</span>


</div>



<small>

кристаллы появятся после связки кошельков

</small>


</div>







<div class="click-power">


+

<span id="clickPower">

0,010

</span>


за клик



<span id="heartPower">

🫀

</span>



</div>




<div class="second-power">


<span>

В секунду:

</span>


<b id="secondPower">

0,000

</b>

</div>





</div>









<div class="fire-zone"

id="fireZone">



<div class="fire-effect"

id="fireEffect">

🔥

</div>





<button

class="main-coin"

id="clickButton">


U


</button>



</div>







<div class="year-label">

2026 UralCoin

</div>






<div id="bonusEffect"

class="bonus-effect">

</div>





</section>









<!-- РЕФЕРАЛЫ -->


<section class="page" id="referrals">


<div class="panel">


<h2>

Рефералы

</h2>



<div class="info-row">

Приглашено:

<b id="friendsCount">

0

</b>


</div>




<input id="refLink"

readonly>


<button class="gold-button"

id="copyReferral">

Копировать ссылку

</button>



</div>


</section>









<!-- ПЕРЕВОДЫ -->


<section class="page"

id="transfer">


<div class="panel">


<h2>

Переводы

</h2>



<input id="transferName"

placeholder="@username">



<input id="transferSum"

placeholder="Количество U"

type="number">



<button class="gold-button"

id="transferButton">

Перевести

</button>



</div>


</section>









<!-- ТОП -->


<section class="page"

id="tops">


<div class="panel">


<h2>

Топ игроков

</h2>



<div id="topList">

</div>



</div>


</section>









<!-- ЕЩЕ -->


<section class="page"

id="more">


<div class="panel">


<h2>

Еще

</h2>




<button class="menu-card">

Промокоды

</button>



<button class="menu-card">

История

</button>



<button class="menu-card">

API ключ

</button>






<h2>

Улучшения

</h2>



<div id="upgradeList">

</div>



</div>


</section>









</main>









<!-- НИЖНЕЕ МЕНЮ -->


<nav class="bottom-nav">


<button class="nav active"

data-page="game">

Главная

</button>




<button class="nav"

data-page="referrals">

Рефералы

</button>





<button class="nav"

data-page="transfer">

Перевод

</button>





<button class="nav"

data-page="tops">

Топ

</button>





<button class="nav"

data-page="more">

Еще

</button>




</nav>









</div>








<script src="config.js"></script>

<script src="telegram.js"></script>

<script src="storage.js"></script>

</html>
