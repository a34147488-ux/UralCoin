<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>UralCoin</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<div class="app">



<header class="header">


<div class="profile-area">


<div class="avatar">

<img id="telegramAvatar" src="">

<span id="avatarLetter">
U
</span>


</div>


<div class="nickname" id="nickname">

Игрок

</div>


</div>





<div class="logo">


<h1>
UralCoin
</h1>


</div>



<button class="dots">

•••

</button>



</header>







<main>



<section class="page active" id="game">



<div class="balance-block">


<div class="balance">

<span id="balance">
0.00
</span>

U

</div>



<div class="power">

+<span id="clickPower">
0.01
</span>

U / клик

</div>



</div>







<button class="coin" id="coin">


<span>
U
</span>


<div class="online">

ONLINE

</div>


</button>





</section>









<section class="page" id="referrals">


<div class="card">


<h2>
Рефералы
</h2>


<div class="stat">

Приглашено:

<b id="refCount">
0
</b>


</div>



<div class="stat">

За человека:

<b>
5000 U
</b>


</div>



<div class="ref-box">


<input id="refLink" readonly>


<button id="copyRef">

Копировать

</button>


</div>



</div>


</section>









<section class="page" id="transfer">


<div class="card">


<h2>
Переводы
</h2>



<input id="transferUser"
placeholder="Username получателя">


<input id="transferAmount"
placeholder="Количество U"
type="number">



<button id="sendTransfer">

Перевести

</button>



</div>



</section>








<section class="page" id="tops">


<div class="card">


<h2>
Топ игроков
</h2>



<div id="topList">


</div>



</div>


</section>









<section class="page" id="more">



<div class="card">


<h2>
Еще
</h2>



<button class="more-item" id="apiKey">

Получить ключ API

</button>



<button class="more-item">

История переводов

</button>



<a class="more-item"
href="https://t.me/+NyqTkXAU-H5hNDky">

Наш канал

</a>




<a class="more-item"
href="https://t.me/BuysStarsBot?start=8265611469">

Купить прем

</a>






<h2 class="upgrade-title">

Улучшения

</h2>



<div class="upgrade">


<div>

Уровень 1

<br>

+0.01 U

</div>


<button data-price="10" data-power="0.01">

10 U

</button>


</div>




<div class="upgrade">


<div>

Уровень 2

<br>

+0.05 U

</div>


<button data-price="100" data-power="0.05">

100 U

</button>


</div>





<div class="upgrade">


<div>

Уровень 3

<br>

+0.10 U

</div>


<button data-price="500" data-power="0.10">

500 U

</button>


</div>






<div class="upgrade">


<div>

Уровень 4

<br>

+0.50 U

</div>


<button data-price="2500" data-power="0.50">

2500 U

</button>


</div>







<div class="upgrade">


<div>

Уровень 5

<br>

+1 U

</div>


<button data-price="10000" data-power="1">

10000 U

</button>


</div>





</div>



</section>



</main>








<nav class="bottom-menu">


<button class="active" data-page="game">

Играть

</button>


<button data-page="referrals">

Рефералы

</button>


<button data-page="transfer">

Переводы

</button>


<button data-page="tops">

Топы

</button>


<button data-page="more">

Еще

</button>


</nav>





</div>





<script src="telegram.js"></script>

<script src="storage.js"></script>

<script src="app.js"></script>

<script src="referrals.js"></script>

<script src="top.js"></script>

<script src="transfer.js"></script>


</body>

</html>
