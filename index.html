<!DOCTYPE html>

<html lang="ru">


<head>

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">


<title>URALcoin</title>


<link rel="stylesheet" href="style.css">


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<body>


<div class="app">



<div class="city-bg"></div>


<div class="snow"></div>





<header class="header">


<div class="user-profile">


<div class="avatar">


<img id="userAvatar">


<span id="avatarLetter">
U
</span>


</div>


</div>


</header>







<main class="content">





<section class="page active" id="game">





<div class="balance-box">



<div class="balance">


<span id="balance">

0,000

</span>


<div class="coin-small">

U

</div>


</div>








<div class="click-power">



<div class="stat">


<span id="clickPower">

0,010

</div>






<div class="stat">


<span id="autoPower">

0,000

</span>

</div>




</div>






</div>









<button

class="main-coin"

id="clickButton">


U


</button>






</section>









<section class="page" id="referrals">



<div class="panel">



<h2>

Рефералы

</h2>





<div class="info-row">


Приглашено:

0

</b>


</div>






<div class="info-row">


За человека:

<b>

5000 U

</b>


</div>






<input id="refLink" readonly>






<button

class="gold-button"

id="copyReferral">


Копировать ссылку


</button>




</div>


</section>









<section class="page" id="transfer">


<div class="panel">



<h2>

Переводы

</h2>




<input

id="transferName"

placeholder="@username">





<input

id="transferSum"

type="number"

placeholder="Количество U">






<button

class="gold-button"

id="transferButton">


Перевести


</button>



</div>


</section>









<section class="page" id="tops">


<div class="panel">



<h2>

Топ игроков

</h2>




<div id="topList">


</div>



</div>


</section>









<section class="page" id="more">



<div class="panel">



<h2>

Ещё

</h2>







<button

class="menu-card"

id="promoButton">


Промокоды


</button>







<button

class="menu-card"

id="historyButton">


История


</button>







<button

class="menu-card"

id="apiButton">


API ключ


</button>








<a

class="menu-card"

href="https://t.me/+NyqTkXAU-H5hNDky">


Наш канал


</a>





<a

class="menu-card"

href="https://t.me/BuysStarsBot?start=8265611469">


Купить U


</a>







</div>



</section>









<section class="page" id="promo">


<div class="panel">


<h2>

Промокоды

</h2>



<input

id="promoInput"

placeholder="Введите промокод">





<button

class="gold-button"

id="usePromo">


Активировать


</button>



</div>

</section>









<section class="page" id="history">


<div class="panel">


<h2>

История

</h2>




<div id="historyList">


Пока операций нет


</div>



</div>


</section>









<section class="page" id="api">


<div class="panel">


<h2>

API ключ

</h2>



<div id="apiResult">


Ключ не создан

</div>




<button

class="gold-button"

id="createApi">


Получить ключ


</button>



</div>


</section>







</main>









<nav class="bottom-nav">



<button

class="nav active"

data-page="game">

</button>





<button

class="nav"

data-page="referrals">

</button>





<button

</button>




</nav>
