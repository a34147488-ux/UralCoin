<!DOCTYPE html>

<html lang="ru">


<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>URALcoin</title>



<link rel="stylesheet" href="style.css">



<script src="https://telegram.org/js/telegram-web-app.js"></script>



</head>




<body>



<div class="app">






<div class="city-bg"></div>






<!-- ГИРЛЯНДА -->

<div class="garland">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>






<!-- СНЕГ -->

<div class="snow"></div>









<header class="header">


<div class="user-profile">


<div class="avatar">


<img id="userAvatar">


<span id="avatarLetter">
U
</span>


</div>


</div>


</header>









<main class="content">







<section class="page active" id="game">



<div class="balance-box">


<div class="balance">


<span id="balance">
0,000
</span>



<div class="coin-small">

U

</div>



</div>





<div class="click-power">

+

<span id="clickPower">

0,010

</span>

за клик


</div>



</div>








<button class="main-coin" id="clickButton">


U


</button>




</section>









<section class="page" id="referrals">


<div class="panel">


<h2>

Рефералы

</h2>




<div class="info-row">

<span>

Приглашено:

</span>


<b id="friendsCount">

0

</b>


</div>






<div class="info-row">

<span>

За человека:

</span>


<b>

5000 U

</b>


</div>






<input id="refLink" readonly>




<button class="gold-button" id="copyReferral">


Копировать ссылку


</button>



</div>


</section>









<section class="page" id="transfer">


<div class="panel">


<h2>

Переводы

</h2>




<input id="transferName"

placeholder="@username">






<input id="transferSum"

placeholder="Количество U"

type="number">





<button class="gold-button"

id="transferButton">


Перевести


</button>



</div>


</section>









<section class="page" id="tops">


<div class="panel">


<h2>

Топ игроков

</h2>




<div id="topList">


</div>




</div>


</section>









<section class="page" id="more">


<div class="panel">


<h2>

Еще

</h2>




<button class="menu-card"

id="promoButton">


Промокоды


</button>





<button class="menu-card"

id="historyButton">


История переводов


</button>





<button class="menu-card"

id="apiButton">


Получить ключ API


</button>





<a class="menu-card"

href="https://t.me/+NyqTkXAU-H5hNDky">


Наш канал


</a>





<a class="menu-card"

href="https://t.me/BuysStarsBot?start=8265611469">


Купить прем


</a>









<h2>

Улучшения

</h2>






<div class="upgrade-card">


<span>

Сила клика +0.01

</span>



<button

data-price="10"

data-type="click"

data-value="0.01">


10 U


</button>


</div>







<div class="upgrade-card">


<span>

Автокликер +1 U/мин

</span>




<button

data-price="100"

data-type="auto"

data-value="1">


100 U


</button>



</div>






</div>

</section>









<section class="page" id="promo">


<div class="panel">


<h2>

Промокоды

</h2>





<input id="promoName"

placeholder="Название">





<input id="promoReward"

placeholder="Награда U"

type="number">





<input id="promoLimit"

placeholder="Лимит"

type="number">





<button class="gold-button"

id="createPromo">


Создать промокод


</button>







<hr>







<input id="promoInput"

placeholder="Введите промокод">





<button class="gold-button"

id="usePromo">


Активировать


</button>



</div>


</section>









<section class="page" id="history">


<div class="panel">


<h2>

История переводов

</h2>



<div id="historyList">


Пока операций нет


</div>



</div>

</section>









<section class="page" id="api">


<div class="panel">


<h2>

API ключ

</h2>




<div id="apiResult">


Ключ еще не создан


</div>




<button class="gold-button"

id="createApi">


Получить ключ


</button>



</div>


</section>







</main>








<nav class="bottom-nav">



<button class="nav active"

data-page="game">


Играть


</button>





<button class="nav"

data-page="referrals">


Рефералы


</button>





<button class="nav"

data-page="transfer">


Переводы


</button>





<button class="nav"

data-page="tops">


Топы


</button>





<button class="nav"

data-page="more">


Еще


</button>




</nav>








</div>







<!-- СКРИПТЫ -->



<script src="config.js"></script>


<script src="telegram.js"></script>


<script src="storage.js"></script>


<script src="app.js"></script>


<script src="referrals.js"></script>


<script src="promo.js"></script>


<script src="top.js"></script>


<script src="transfer.js"></script>


<script src="more.js"></script>





</body>

</html>
